# Monitor configurations for SwayFX
# Copy this file and customize for your setup
# Run `swaymsg -t get_outputs` to see your monitor names and available modes

# Example configuration:
# output eDP-1 {
#     resolution 1920x1080
#     position 0 0
#     scale 1
#     background ~/Pictures/wallpapers/your-wallpaper.jpg fill
# }

# output HDMI-A-1 {
#     resolution 2560x1440
#     position 1920 0
#     scale 1
# }

# output DP-1 {
#     mode 3840x2160@144Hz
#     position 0 0
#     scale 1
# }

# Common options:
# output <name> resolution <WxH>[@Hz] position <X,Y> scale <float> transform <normal|90|180|270|flipped|flipped-90|flipped-180|flipped-270>
# output <name> bg <path> <fill|stretch|fit|center|tile>
# output <name> enable|disable
# output <name> adaptive_sync on|off

# For multiple monitors, you can use relative positioning:
# output eDP-1 position 0 0
# output HDMI-A-1 position 1920 0

# To apply: reload sway config or run the commands via swaymsg