# Window rules for SwayFX
# Ported from hyprland config

# Wallpaper picker
for_window [app_id="wallpaper-picker"] floating enable
for_window [app_id="wallpaper-picker"] border none
for_window [app_id="wallpaper-picker"] resize set width 1300 px height 400 px
for_window [app_id="wallpaper-picker"] move position center

# Sway help
for_window [app_id="sway_help"] floating enable
for_window [app_id="sway_help"] resize set width 900 px height 600 px
for_window [app_id="sway_help"] move position center


# Polkit elevation fix
for_window [app_id="polkit-gnome-authentication-agent-1"] floating enable
for_window [app_id="polkit-gnome-authentication-agent-1"] border pixel 3
for_window [app_id="polkit-gnome-authentication-agent-1"] move position center

# XDG portal file chooser (GTK)
for_window [app_id="xdg-desktop-portal-gtk"] floating enable
for_window [app_id="xdg-desktop-portal-gtk"] border pixel 3
for_window [app_id="xdg-desktop-portal-gtk"] resize set width 950 px height 600 px
for_window [app_id="xdg-desktop-portal-gtk"] move position center

# XDG portal fallback chooser (file picker dialogs)
for_window [title="Open File"] floating enable
for_window [title="Open File"] resize set width 950 px height 600 px
for_window [title="Open File"] move position center

for_window [title="Save File"] floating enable
for_window [title="Save File"] resize set width 950 px height 600 px
for_window [title="Save File"] move position center

for_window [title="Select a Directory"] floating enable
for_window [title="Select a Directory"] resize set width 950 px height 600 px
for_window [title="Select a Directory"] move position center

for_window [title="Choose Image"] floating enable
for_window [title="Choose Image"] resize set width 950 px height 600 px
for_window [title="Choose Image"] move position center

for_window [title="Select one or more files to open"] floating enable
for_window [title="Select one or more files to open"] resize set width 950 px height 600 px
for_window [title="Select one or more files to open"] move position center

for_window [title="Open Document"] floating enable
for_window [title="Open Document"] resize set width 950 px height 600 px
for_window [title="Open Document"] move position center

# Help menu (hypr_help equivalent - kitty with class hypr_help)
for_window [class="hypr_help"] floating enable
for_window [class="hypr_help"] resize set width 900 px height 600 px
for_window [class="hypr_help"] move position center

# Quick settings (kitty with class quick-settings)
for_window [class="quick-settings"] floating enable
for_window [class="quick-settings"] resize set width 770 px height 550 px
for_window [class="quick-settings"] move position center

# GNOME Calculator
for_window [app_id="org.gnome.Calculator"] floating enable
#for_window [app_id="org.gnome.Calculator"] border pixel 3
for_window [app_id="org.gnome.Calculator"] resize set width 400 px height 500 px
for_window [app_id="org.gnome.Calculator"] move position center

# Frog OCR
for_window [app_id="com.github.tenderowl.frog"] floating enable
for_window [app_id="com.github.tenderowl.frog"] border pixel 3
for_window [app_id="com.github.tenderowl.frog"] resize set width 500 px height 600 px
for_window [app_id="com.github.tenderowl.frog"] move position center

# Pomotroid
for_window [app_id="pomotroid"] floating enable
for_window [app_id="pomotroid"] border pixel 3
for_window [app_id="pomotroid"] resize set width 402 px height 468 px
for_window [app_id="pomotroid"] move absolute position 104 72

# VideoDownloader
for_window [app_id="com.github.unrud.VideoDownloader"] floating enable
for_window [app_id="com.github.unrud.VideoDownloader"] border pixel 3
for_window [app_id="com.github.unrud.VideoDownloader"] resize set width 661 px height 482 px
for_window [app_id="com.github.unrud.VideoDownloader"] move position center

# Qalculate-GTK
for_window [app_id="qalculate-gtk"] floating enable
for_window [app_id="qalculate-gtk"] border pixel 3
for_window [app_id="qalculate-gtk"] resize set width 651 px height 677 px
for_window [app_id="qalculate-gtk"] move absolute position 623 55

# Ghostty scratchpad (special workspace)
for_window [app_id="ghostty-scratchpad"] floating enable
for_window [app_id="ghostty-scratchpad"] border none
for_window [app_id="ghostty-scratchpad"] resize set width 70% height 65%
for_window [app_id="ghostty-scratchpad"] move position center

# Gsimplecal dropdown
for_window [app_id="gsimplecal"] floating enable
for_window [app_id="gsimplecal"] move absolute position 8 34

# Xwayland video bridge fixes
for_window [app_id="xwaylandvideobridge"] opacity 0
for_window [app_id="xwaylandvideobridge"] floating enable
for_window [app_id="xwaylandvideobridge"] move position center