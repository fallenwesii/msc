# Environment variables
set $XDG_CURRENT_DESKTOP sway
set $XDG_PORTAL_BACKENDS wlr,gtk

# Reload environment from environment.d
exec systemctl --user daemon-reload
exec systemctl --user import-environment

# Set environment variables for cursor theme, QT, etc.
exec dbus-update-activation-environment --systemd \
  XCURSOR_THEME XCURSOR_SIZE \
  QT_QPA_PLATFORMTHEME QT_QPA_PLATFORM \
  GBM_BACKEND \
  XDG_SESSION_TYPE XDG_SESSION_DESKTOP \
  XDG_CURRENT_DESKTOP XDG_PORTAL_BACKENDS \
  DISPLAY WAYLAND_DISPLAY SWAY_SOCKET

exec systemctl --user import-environment \
  XCURSOR_THEME XCURSOR_SIZE \
  QT_QPA_PLATFORMTHEME QT_QPA_PLATFORM \
  GBM_BACKEND \
  XDG_SESSION_TYPE XDG_SESSION_DESKTOP \
  XDG_CURRENT_DESKTOP XDG_PORTAL_BACKENDS \
  DISPLAY WAYLAND_DISPLAY SWAY_SOCKET

# Cursor theme
exec /usr/bin/env XCURSOR_THEME=Bibata-Modern-Classic XCURSOR_SIZE=24 dbus-update-activation-environment --systemd XCURSOR_THEME XCURSOR_SIZE

# QT theme
exec /usr/bin/env QT_QPA_PLATFORMTHEME=qt6ct QT_QPA_PLATFORM=wayland dbus-update-activation-environment --systemd QT_QPA_PLATFORMTHEME QT_QPA_PLATFORM

# GBM backend for NVIDIA
exec /usr/bin/env GBM_BACKEND=nvidia-drm dbus-update-activation-environment --systemd GBM_BACKEND

# XDG session
exec /usr/bin/env XDG_SESSION_TYPE=wayland XDG_SESSION_DESKTOP=sway dbus-update-activation-environment --systemd XDG_SESSION_TYPE XDG_SESSION_DESKTOP

# Start xdg-desktop-portal
exec systemctl --user --no-block start xdg-desktop-portal
exec /usr/libexec/xdg-desktop-portal-gtk