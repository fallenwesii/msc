# Miscellaneous settings
# Sway equivalent of hyprland's misc.conf

# Input device configurations
# Example per-device config:
# input "yichip-wireless-device-mouse" {
#     scroll_factor 0.7
# }

# To find your device name, run: swaymsg -t get_inputs
# Then add device-specific configs below:

# device "yichip-wireless-device-mouse" {
#     scroll_factor 0.7
# }

# Focus follows mouse (equivalent to hyprland's follow_mouse = 1)
# focus_follows_mouse yes

# Cursor theme and size (handled by env vars in env.conf)
# See env.conf for XCURSOR_THEME and XCURSOR_SIZE