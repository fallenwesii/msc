# SwayFX Startup Applications
# exec = runs once at startup (like hyprland's exec-once)
# exec_always = runs on startup AND on every config reload (like hyprland's exec)

# Window management
exec_always autotiling --limit 2

# Authentication agent
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Clipboard history
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

# Quick settings daemon
exec qs -d

# Wallpaper daemon
exec awww-daemon

# Idle management (lock screen, power off outputs)
exec swayidle -w \
         timeout 300 'swaymsg exec gtklock' \
         timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
         before-sleep 'swaymsg exec gtklock'

# Media-aware idle management (prevents sleep during video playback)
exec ~/.config/sway/scripts/media-idle.sh &

# Preload Nautilus as a background service so it launches instantly
exec nautilus --gapplication-service

# Status bar & notifications
exec waybar
exec swaync